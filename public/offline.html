<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GRIND — Offline</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f0f0f;
    color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    box-sizing: border-box;
  }
  .mark {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    background: #0f0f0f;
    border: 1px solid #2e2e2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial Black, Arial, sans-serif;
    font-weight: 900;
    font-size: 34px;
    color: #c8f135;
  }
  h1 {
    font-family: 'Bebas Neue', -apple-system, sans-serif;
    letter-spacing: 0.5px;
    font-size: 22px;
    margin: 0;
    color: #f0f0f0;
  }
  p {
    margin: 0;
    max-width: 320px;
    font-size: 14px;
    line-height: 1.5;
    color: #888888;
  }
  button {
    margin-top: 8px;
    padding: 12px 24px;
    border-radius: 9999px;
    border: none;
    background: #c8f135;
    color: #0f0f0f;
    font-weight: 700;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">G</div>
    <h1>You&rsquo;re offline</h1>
    <p>GRIND needs a connection to load this page. Reconnect and try again — anything you already logged this session is safe.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
